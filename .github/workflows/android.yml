name: Android CI

on:
  push:
    branches: '*'
  pull_request:
    branches: '*'

jobs:
  test:
    runs-on: macos-13
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'adopt'
        cache: gradle

    - name: run tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        # Скрипт заходит в папку, дает права и запускает тесты в нужномй папке
        script: |
          cd "mqa-homeworks/2.2 UI Automator/sample"
          chmod +x gradlew
          ./gradlew connectedCheck
